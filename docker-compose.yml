services:
  perfil:
    build: .
    ports: ["${APP_PORT:-8104}:3000"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NUXT_APP_ENV: ${NUXT_APP_ENV:-production}
      NUXT_PUBLIC_APP_ENV: ${NUXT_PUBLIC_APP_ENV:-production}
      NUXT_OPENAI_API_KEY: ${NUXT_OPENAI_API_KEY}
      NUXT_OPENAI_MODEL: ${NUXT_OPENAI_MODEL:-gpt-4o-mini}
      NUXT_DATABASE_PATH: /app/data/perfil.sqlite
    volumes:
      - perfil-data:/app/data
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
volumes:
  perfil-data:
    name: ${DATA_VOLUME_NAME:-pista-game_perfil-data}
    external: true
